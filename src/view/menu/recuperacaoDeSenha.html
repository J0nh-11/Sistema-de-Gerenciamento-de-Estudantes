<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/recuperacao.css" />
    <script src="/js/recuperacao.js"></script>
    <title>Recuperar Senha</title>
</head>
<body>

    <div class="card">
        <div id="form-step">
            <div class="icon-container">
                <svg viewBox="0 0 24 24">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
            </div>

            <h2>Esqueceu a senha?</h2>
            <p>Não se preocupe! Digite o e-mail associado à sua conta e enviaremos um link para redefinir sua senha.</p>

            <form id="recovery-form">
                <div class="input-group">
                    <label for="email">E-mail cadastrado</label>
                    <input type="email" id="email" placeholder="exemplo@email.com" required>
                </div>
                <button type="submit">Enviar link de recuperação</button>
            </form>
        </div>

        <div id="success-step" class="hidden">
            <div class="icon-container icon-success">
                <svg viewBox="0 0 24 24">
                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
            </div>
            <h2>Verifique seu e-mail</h2>
            <p>Enviamos um link de recuperação para <strong id="user-email"></strong>. Se não encontrar o e-mail em alguns minutos, verifique a pasta de spam.</p>
        </div>

        <a href="#" class="back-to-login">← Voltar para o login</a>
    </div>

</body>
</html>
