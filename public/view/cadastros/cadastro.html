<!doctype html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="/css/cadastro.css">

</head>

<body>

    <div class="container">

        <h2>Cadastro</h2>

        <form id="cadastroForm">

            <div class="input-group">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    required>

            </div>

            <div class="input-group">

                <label for="cpf">
                    CPF
                </label>

                <input
                    type="text"
                    id="cpf"
                    readonly>

            </div>

            <div class="input-group">

                <label for="tipoUsuario">
                    Tipo de Usuário
                </label>

                <input
                    type="text"
                    id="tipoUsuario"
                    readonly>

            </div>

            <div class="input-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    required>

            </div>

            <div class="input-group">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    required>

            </div>

            <button type="submit">
                Criar Conta
            </button>

        </form>

        <a href="/login">
            Voltar ao login
        </a>

    </div>

    <script src="/js/cadastro.js"></script>

</body>
</html>
