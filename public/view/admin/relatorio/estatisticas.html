<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Estatísticas</title>
        <link rel="stylesheet" href="/css/admin.css" />
    </head>
    <body>
        <div class="container">
            <h1>Estatísticas da Instituição</h1>

            <div class="stats-grid">
                <div class="card">
                    <h3>Taxa de Aprovação</h3>
                    <h2>87%</h2>
                </div>

                <div class="card">
                    <h3>Taxa de Reprovação</h3>
                    <h2>13%</h2>
                </div>

                <div class="card">
                    <h3>Frequência Média</h3>
                    <h2>92%</h2>
                </div>

                <div class="card">
                    <h3>Média Geral</h3>
                    <h2>8.2</h2>
                </div>
            </div>

            <br />

            <table>
                <thead>
                    <tr>
                        <th>Disciplina</th>
                        <th>Média</th>
                        <th>Aprovação</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Banco de Dados</td>
                        <td>8.4</td>
                        <td>91%</td>
                    </tr>

                    <tr>
                        <td>Programação Web</td>
                        <td>7.9</td>
                        <td>86%</td>
                    </tr>

                    <tr>
                        <td>Estrutura de Dados</td>
                        <td>8.1</td>
                        <td>88%</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
