<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Portal Acadêmico - Login</title>

        <link rel="stylesheet" href="/css/telaMenu.css" />
    </head>

    <body>
        <div class="login-container">
            <h2>Bem-vindo ao Portal</h2>

            <div class="tab-container">
                <button class="tab-btn active" onclick="switchTab('discente')">
                    Discente
                </button>

                <button class="tab-btn" onclick="switchTab('docente')">
                    Docente
                </button>

                <button class="tab-btn" onclick="switchTab('responsavel')">
                    Responsável
                </button>

                <button class="tab-btn" onclick="switchTab('admin')">
                    Admin
                </button>
            </div>

            <form id="loginForm" method="post">
                <p id="user-context">Acesso para <strong>Aluno</strong></p>

                <div class="input-group">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu acesso"
                        required />
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="••••••••"
                        required />
                </div>

                <button type="submit" class="login-btn">Entrar</button>
                <!-- BOTÃO DE CADASTRO -->
                <button
                    type="button"
                    class="cadastro-btn"
                    onclick="window.location.href = '/cadastro'">
                    Se cadastrar
                </button>
                <!-- LINK RECUPERAR SENHA -->
                <a href="/recuperacaoDeSenha" class="forgot-password">
                    Esqueceu a Senha?
                </a>
            </form>
        </div>

        <script src="/js/telaMenu.js"></script>
    </body>
</html>
